name: Build git-annex on Windows

on:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: C:/msys64/usr/bin/bash.exe -e {0}

env:
  LANG: C.utf-8

jobs:
  build-package:
    runs-on: windows-2022
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Handle long filenames
        run: git config --system core.longpaths true

      - name: Sparse checkout git-annex
        # we fetch shallow, assuming the last 6 months still have a
        # usable tag to determine a version
        run: |
          git submodule init git-annex
          git clone --shallow-since 6.month.ago $(git config submodule.git-annex.url) git-annex
          git submodule update --init --recursive --force git-annex

      - name: Configure build environment
        id: myvars
        working-directory: ./git-annex
        run: |
          cp cabal-stackage.project cabal.project
          ghc_version=$(grep 'with-compiler' cabal-stackage.config | sed 's/.* ghc-//')
          echo "GHC_VERSION=$ghc_version" >> $GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: "false"

      - name: Get build version
        id: build-version
        working-directory: ./git-annex
        run: |
          mkdir -p dist
          version="$(git describe HEAD | sed -e 's/-/+git/')"
          arch=x64
          echo "Building $version"
          echo "version=${version}_$arch" >> "$GITHUB_OUTPUT"
          echo "$(git describe HEAD | sed -e 's/-/./' | sed -e 's/-g.*//')" > dist/pypi-version
          uv run --no-project python -c 'import sysconfig; print(sysconfig.get_platform().replace(".", "_").replace("-", "_"))' > dist/platform-tag

      - name: Add msys to path
        run: |
          echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - name: Install pkg-config
        run: |
          echo "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_SYSTEM_LIBS=1"   >> $GITHUB_ENV
          ghcup run -m -- pacman --noconfirm -S mingw-w64-x86_64-pkg-config
      
      - name: Install libmagic
        run: |
          ghcup run -m -- pacman --noconfirm -S mingw-w64-x86_64-file
          cp /c/msys64/mingw64/share/misc/magic.mgc git-annex/

      - name: Install libbotan
        run: |
          ghcup run -m -- pacman --noconfirm -S mingw-w64-x86_64-libbotan

      - name: Setup Haskell
        id: setup-haskell
        uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: ${{ steps.myvars.outputs.GHC_VERSION }}
          cabal-version: 3.16

      - name: cabal configure
        working-directory: ./git-annex
        run: |
          cabal configure \
            --extra-prog-path=C:/msys64/mingw64/bin \
            --extra-include-dirs=C:/msys64/mingw64/include \
            --extra-lib-dirs=C:/msys64/mingw64/lib

      # generate git-annex/dist-newstyle/cache/plan.json used in caching
      - name: generate cabal plan
        working-directory: ./git-annex
        run: |
          cabal build all --dry-run

      - name: Restore cache
        uses: actions/cache/restore@v6
        id: restore-cabal-cache
        env:
          key: cache-cabal-windows
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ env.key }}-${{ hashFiles('git-annex/dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Build cabal dependencies
        working-directory: ./git-annex
        run: |
          cabal build --only-dependencies

      - name: Save cache
        uses: actions/cache/save@v6
        if: ${{ steps.restore-cabal-cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ steps.restore-cabal-cache.outputs.cache-primary-key }}

      - name: Build git-annex
        working-directory: ./git-annex
        run: |
          cabal build
          cp $(cabal list-bin git-annex) ./git-annex.exe
          ./git-annex version
      
      - name: Update version info
        working-directory: ./git-annex
        run: |
          mkdir -p dist
          ./git-annex version --raw > dist/build-version

      - name: Copy linked dlls
        working-directory: ./git-annex
        run: |
          for f in $(ldd ./git-annex | sed 's/.*=> //' | sed 's/ .*//' | grep .dll | grep msys64); do
            cp -v "$f" .
          done

      - name: Build the Python wheel
        run: |
          uv build --wheel
      
      - name: Remove msys from path
        run: |
          rm "$GITHUB_PATH"

      - name: Inspect and install
        run: |
          unzip -l dist/git_annex-*.whl
          uv venv
          source .venv/Scripts/activate
          uv pip install dist/git_annex-*.whl
          ls -lR .venv

      - name: Test git-annex
        # Install the wheel and test that installation
        run: |
          source .venv/Scripts/activate
          git-annex version
          git-annex version | grep MagicMime
          git-annex test

      - name: PyPi upload
        # only attempt an upload for release tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: uv publish
